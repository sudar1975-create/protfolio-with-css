
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        nav {
            background: #222;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            transition: color 0.4s;
        }

        nav a:hover {
            color: orange;
        }

        .profile {
            text-align: center;
            padding: 30px;
            animation: fadeIn 2s;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            filter: grayscale(100%);
            transition: 0.5s;
        }

        .profile img:hover {
            filter: grayscale(0%);
            transform: scale(1.1);
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: #e0f0ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Portfolio</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
        </div>
    </nav>

    <section class="profile" id="home">
        <img src="https://placehold.co/120x120"
             alt="Profile Picture">
        <h1>Hello, I'm a Web Developer</h1>
        <p>Welcome to my portfolio website.</p>
    </section>

    <section class="profile" id="skills">
        <h2>My Skills</h2>
        <p>HTML | CSS | JavaScript | Python | Java</p>
    </section>

    <section class="projects" id="projects">
        <div class="card">
            <h3>Project 1</h3>
            <p>Student Registration Website</p>
        </div>

        <div class="card">
            <h3>Project 2</h3>
            <p>College Event Page</p>
        </div>

        <div class="card">
            <h3>Project 3</h3>
            <p>Grade Calculator</p>
        </div>
    </section>

</body>
</html>
